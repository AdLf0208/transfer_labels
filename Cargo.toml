# Minecraft Java 1.21.1 NeoForge. Local-only until the maintainer approves.
name = "horizon-transfer-labels"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Transfer Labels for Horizon: a label on a block face moves items between two containers"

